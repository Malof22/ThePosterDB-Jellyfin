name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*.*'
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        run: |
          dotnet publish Jellyfin.Plugin.PosterDB/Jellyfin.Plugin.PosterDB.csproj \
            --configuration Release \
            --no-build \
            --output ./dist

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install JPRM
        run: pip install jprm

      - name: Publish
        run: |
          dotnet publish Jellyfin.Plugin.PosterDB/Jellyfin.Plugin.PosterDB.csproj \
            --configuration Release \
            --output ./dist

      - name: Package plugin
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p artifacts
          jprm plugin package --version "$version" --output ./artifacts ./dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true

      - name: Update manifest.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          zip_name="posterdb_${version}.zip"
          zip_url="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/${zip_name}"
          jprm repo add --plugin-url "$zip_url" manifest.json

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --staged --quiet || git commit -m "chore: update manifest for ${GITHUB_REF_NAME}"
          git push origin HEAD:main
